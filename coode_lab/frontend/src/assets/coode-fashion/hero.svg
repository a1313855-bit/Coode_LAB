<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f1ec"/>
      <stop offset="1" stop-color="#e7e2da"/>
    </linearGradient>
    <linearGradient id="fig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2724"/>
      <stop offset="1" stop-color="#141210"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <g opacity="0.5">
    <rect x="1180" y="120" width="300" height="300" fill="none" stroke="#c6bfb4" stroke-width="2"/>
    <rect x="1260" y="200" width="300" height="300" fill="none" stroke="#c6bfb4" stroke-width="2"/>
  </g>
  <!-- 抽象人像（灰階、低彩度） -->
  <ellipse cx="800" cy="560" rx="180" ry="230" fill="#d8d3ca" opacity="0.9"/>
  <ellipse cx="800" cy="296" rx="96" ry="112" fill="#c9c3b8"/>
  <rect x="668" y="470" width="264" height="360" rx="120" fill="url(#fig)"/>
  <!-- 字樣 -->
  <text x="120" y="150" font-family="Helvetica, Arial, sans-serif" font-size="30" letter-spacing="12" fill="#1c1a17">COODE LAB</text>
  <text x="120" y="200" font-family="Helvetica, Arial, sans-serif" font-size="88" letter-spacing="18" font-weight="700" fill="#171717">NEW</text>
  <text x="120" y="300" font-family="Helvetica, Arial, sans-serif" font-size="88" letter-spacing="18" font-weight="700" fill="#171717">ARRIVALS</text>
</svg>