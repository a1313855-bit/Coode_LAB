spring.application.name=coode_lab

# ===============================
# Server
# ===============================
server.port=8080

# MySQL 資料庫連線設定（請依據你的環境修改密碼）
spring.datasource.url=jdbc:mysql://localhost:3306/coode_lab?allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate 設定 update , validate , create-drop
spring.jpa.hibernate.ddl-auto=update

# Console 顯示 Hibernate 執行的 SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.devtools.restart.enabled=false

# 檔案上傳大小限制（商品圖 / 試穿圖）
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB